const FPS = 12;      // velocidad de la animación (frame por frame, como un GIF)
const R = 5;         // radio del punto
const PASO = R * 2;  // los puntos se tocan

const svg = document.getElementById('perro');
const NS = 'http://www.w3.org/2000/svg';
const filas = FRAMES[0].length, cols = FRAMES[0][0].length;
const PAD = R * 2;
svg.setAttribute('viewBox', `0 0 ${cols * PASO + PAD * 2} ${filas * PASO + PAD * 2}`);

// Un círculo por celda; cada frame solo muestra u oculta (sin interpolar)
const celdas = [];
for (let y = 0; y < filas; y++) {
  for (let x = 0; x < cols; x++) {
    const c = document.createElementNS(NS, 'circle');
    const cx = PAD + R + x * PASO, cy = PAD + R + y * PASO;
    c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', R);
    c.style.visibility = 'hidden';
    svg.appendChild(c);
    celdas.push({ el: c, cx, cy, on: false });
  }
}

function dibujar(i) {
  const f = FRAMES[i];
  for (let y = 0; y < filas; y++) {
    for (let x = 0; x < cols; x++) {
      const c = celdas[y * cols + x];
      const on = f[y][x] === '#';
      if (on !== c.on) { c.on = on; c.el.style.visibility = on ? 'visible' : 'hidden'; }
    }
  }
}

let i = 0, ultimo = 0;
function tick(t) {
  if (t - ultimo >= 1000 / FPS) {
    ultimo = t;
    dibujar(i);
    i = (i + 1) % FRAMES.length;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// Los puntos se encogen cerca del cursor
svg.addEventListener('pointermove', e => {
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const m = pt.matrixTransform(svg.getScreenCTM().inverse());
  for (const p of celdas) {
    const d = Math.hypot(p.cx - m.x, p.cy - m.y);
    p.el.style.transform = `scale(${Math.min(1, 0.25 + d / 50)})`;
  }
});
svg.addEventListener('pointerleave', () => { for (const p of celdas) p.el.style.transform = ''; });
